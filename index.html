<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#eef0f1; --panel:#ffffff; --ink:#1b2a38; --ink-soft:#5a6b78;
    --line:#d9dee1; --accent:#2e6f8e; --accent-soft:#e3eef3;
    --amber:#c4531d; --amber-soft:#fbebe0;
    --green:#3f7d58; --green-soft:#e7f1ea;
    --red:#b23a3a; --red-soft:#f8e9e9;
    --gold:#a8791a; --gold-soft:#f6efdd;
    --gray-soft:#eceeef;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  .pst-root{font-family:'Inter',sans-serif; color:var(--ink); background:var(--bg); padding:0; min-height:100%; font-size:14px;}
  .pst-header{background:var(--ink); color:#fff; padding:22px 24px 18px; position:relative;}
  .pst-gear{position:absolute; top:16px; right:18px; width:36px; height:36px; border-radius:50%; border:1px solid #445a6b; background:#243444; color:#a9bccb; font-size:17px; cursor:pointer; transition:all .15s;}
  .pst-gear:hover{color:#fff; border-color:var(--accent);}
  .pst-logo{position:absolute; top:20px; right:66px; height:28px; width:auto;}
  .pst-whoami{font-family:'Inter',sans-serif; font-size:12px; color:#a9bccb; margin-top:10px; display:flex; align-items:center; gap:8px;}
  .pst-whoami b{color:#fff;}
  .pst-whoami button{font-family:'Inter',sans-serif; font-size:11.5px; font-weight:600; background:none; border:1px solid #445a6b; color:#a9bccb; padding:3px 9px; border-radius:12px; cursor:pointer;}
  .pst-whoami button:hover{color:#fff; border-color:var(--accent);}
  .pst-title{font-family:'Oswald',sans-serif; font-weight:700; font-size:26px; letter-spacing:0.5px; text-transform:uppercase; margin:0;}
  .pst-sub{font-family:'IBM Plex Mono',monospace; font-size:12px; color:#a9bccb; margin-top:4px; letter-spacing:0.5px;}
  .pst-ladder{display:flex; align-items:center; gap:0; margin-top:16px; max-width:640px;}
  .pst-node{display:flex; flex-direction:column; align-items:center; flex:1; position:relative;}
  .pst-dot{width:12px; height:12px; border-radius:50%; background:#3c4f5f; border:2px solid #5a6b78; z-index:1;}
  .pst-node.active .pst-dot{background:var(--accent); border-color:#8fc4dc;}
  .pst-node-label{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:#8ba0b0; margin-top:6px;}
  .pst-node-count{font-family:'Oswald',sans-serif; font-size:18px; color:#fff; margin-top:2px;}
  .pst-line{position:absolute; top:5px; left:50%; width:100%; height:2px; background:#3c4f5f; z-index:0;}
  .pst-node:last-child .pst-line{display:none;}

  .pst-tabs{display:flex; gap:2px; background:#dde2e4; padding:4px; margin:20px 24px 0; border-radius:8px; max-width:fit-content;}
  .pst-tab{font-family:'Inter',sans-serif; font-weight:600; font-size:13px; padding:8px 16px; border:none; background:transparent; color:var(--ink-soft); cursor:pointer; border-radius:6px; transition:all .15s;}
  .pst-tab.active{background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .pst-tab:hover:not(.active){color:var(--ink);}

  .pst-body{padding:20px 24px 40px;}
  .pst-panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px;}
  .pst-panel-title{font-family:'Oswald',sans-serif; font-size:16px; text-transform:uppercase; letter-spacing:0.5px; margin:0 0 4px;}
  .pst-panel-desc{color:var(--ink-soft); font-size:12.5px; margin:0 0 16px;}

  .pst-banner{background:var(--amber-soft); border:1px solid var(--amber); color:var(--amber); padding:12px 16px; border-radius:var(--radius); font-size:13px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
  .pst-banner button{font-family:'Inter',sans-serif; font-weight:600; font-size:12px; background:var(--amber); color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; white-space:nowrap;}

  .pst-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .pst-field{display:flex; flex-direction:column; gap:4px;}
  .pst-field.full{grid-column:1/-1;}
  .pst-field label{font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.3px;}
  .pst-field input, .pst-field select, .pst-field textarea{
    font-family:'Inter',sans-serif; font-size:13.5px; padding:8px 10px; border:1px solid var(--line); border-radius:5px; background:#fcfcfc; color:var(--ink);
  }
  .pst-field input:focus, .pst-field select:focus, .pst-field textarea:focus{outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); background:#fff;}
  .pst-field textarea{resize:vertical; min-height:56px; font-family:'Inter',sans-serif;}

  .pst-btn{font-family:'Inter',sans-serif; font-weight:600; font-size:13px; padding:9px 18px; border:none; border-radius:5px; cursor:pointer; transition:opacity .15s;}
  .pst-btn:hover{opacity:.88;}
  .pst-btn:disabled{opacity:.5; cursor:not-allowed;}
  .pst-btn-primary{background:var(--accent); color:#fff;}
  .pst-btn-green{background:var(--green); color:#fff;}
  .pst-btn-red{background:var(--red); color:#fff;}
  .pst-btn-ghost{background:transparent; color:var(--accent); border:1px solid var(--accent);}
  .pst-btn-row{display:flex; gap:8px; margin-top:14px;}

  .pst-toolbar{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
  .pst-toolbar input:not([type="checkbox"]):not([type="radio"]), .pst-toolbar select{font-family:'Inter',sans-serif; font-size:13px; padding:7px 10px; border:1px solid var(--line); border-radius:5px; background:#fff;}
  .pst-toolbar input[type=text]{flex:1; min-width:160px;}
  .pst-count{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-left:auto;}

  table.pst-table{width:100%; min-width:1800px; border-collapse:collapse; font-size:12.5px;}
  .pst-table-scroll{overflow:auto; max-height:65vh; border:1px solid var(--line); border-radius:8px;}
  .pst-table-scroll table.pst-table th{position:sticky; top:0; background:var(--panel); z-index:1; box-shadow:0 1px 0 var(--line);}
  .pst-lightbox{position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center; padding:24px;}
  .pst-lightbox-backdrop{position:absolute; inset:0; background:rgba(10,16,22,0.88);}
  .pst-lightbox-content{position:relative; z-index:1; max-width:min(92vw,900px); max-height:90vh; background:var(--panel); border-radius:10px; padding:18px; display:flex; flex-direction:column; align-items:center; gap:14px;}
  .pst-lightbox-close{position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:15px; color:var(--ink-soft); line-height:1;}
  .pst-lightbox-close:hover{color:var(--ink); border-color:var(--accent);}
  .pst-lightbox-img{max-width:100%; max-height:68vh; border-radius:6px; object-fit:contain;}
  .pst-lightbox-loading{padding:60px 50px; color:var(--ink-soft); font-size:13px;}
  .pst-lightbox-actions{display:flex; gap:8px;}
  table.pst-table th{text-align:left; font-family:'Inter',sans-serif; font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-soft); border-bottom:2px solid var(--line); padding:8px 8px; white-space:nowrap;}
  table.pst-table th.ov-sortable{cursor:pointer; user-select:none;}
  table.pst-table th.ov-sortable:hover{color:var(--ink);}
  table.pst-table th.ov-sorted{color:var(--accent, var(--ink));}
  .ov-sort-arrow{font-size:9px;}
  table.pst-table td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top;}
  table.pst-table tr:hover td{background:#f7f9fa;}
  .pst-mono{font-family:'IBM Plex Mono',monospace; font-size:11.5px;}

  .pill{display:inline-block; padding:3px 9px; border-radius:20px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; white-space:nowrap;}
  .pill-amber{background:var(--amber-soft); color:var(--amber);}
  .pill-gold{background:var(--gold-soft); color:var(--gold);}
  .pill-green{background:var(--green-soft); color:var(--green);}
  .pill-red{background:var(--red-soft); color:var(--red);}
  .pill-gray{background:var(--gray-soft); color:var(--ink-soft);}
  .pill-accent{background:var(--accent-soft); color:var(--accent);}

  .pst-empty{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .pst-empty-title{font-family:'Oswald',sans-serif; font-size:15px; text-transform:uppercase; color:var(--ink); margin-bottom:4px;}

  .pst-card{border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; background:#fff;}
  .pst-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:8px;}
  .pst-card-title{font-weight:700; font-size:14px;}
  .pst-card-meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .pst-card-detail{font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin-bottom:10px;}
  .pst-card-detail b{color:var(--ink); font-weight:600;}

  .pst-code{font-family:'IBM Plex Mono',monospace; font-size:11.5px; background:#1b2a38; color:#cfe3ee; padding:14px; border-radius:6px; white-space:pre-wrap; line-height:1.6; overflow-x:auto;}
  .pst-msg{font-size:12.5px; padding:8px 12px; border-radius:5px; margin-top:10px;}
  .pst-msg-ok{background:var(--green-soft); color:var(--green);}
  .pst-msg-err{background:var(--red-soft); color:var(--red);}

  .pst-role-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-top:6px;}
  .pst-role-card{border:1px solid var(--line); border-radius:10px; padding:20px 16px; background:#fff; cursor:pointer; text-align:left; transition:all .15s; font-family:'Inter',sans-serif;}
  .pst-role-card:hover{border-color:var(--accent); box-shadow:0 2px 10px rgba(0,0,0,.06); transform:translateY(-1px);}
  .pst-role-icon{font-size:24px; margin-bottom:10px; display:block;}
  .pst-role-name{font-family:'Oswald',sans-serif; font-size:16px; text-transform:uppercase; letter-spacing:0.3px; margin-bottom:4px;}
  .pst-role-desc{font-size:12px; color:var(--ink-soft); line-height:1.5;}

  .pst-userlist{width:100%; border-collapse:collapse; font-size:13px; margin-top:6px;}
  .pst-userlist th{text-align:left; font-size:10.5px; text-transform:uppercase; color:var(--ink-soft); border-bottom:2px solid var(--line); padding:6px 8px;}
  .pst-userlist td{padding:7px 8px; border-bottom:1px solid var(--line);}
  .pst-userlist input, .pst-userlist select{font-family:'Inter',sans-serif; font-size:12.5px; padding:5px 7px; border:1px solid var(--line); border-radius:4px; width:100%;}
  .pst-icon-btn{background:none; border:none; cursor:pointer; font-size:14px; padding:4px 6px; color:var(--ink-soft);}
  .pst-icon-btn:hover{color:var(--red);}

  @media (max-width: 640px){
    .pst-role-grid{grid-template-columns:1fr;}
  }

  @media (max-width: 640px){
    .pst-grid{grid-template-columns:1fr;}
    .pst-header{padding:16px 14px;}
    .pst-title{font-size:22px;}
    .pst-logo{height:20px; top:16px; right:50px;}
    .pst-ladder{max-width:100%;}
    .pst-node-label{font-size:8.5px;}
    .pst-node-count{font-size:15px;}
    .pst-tabs{margin:14px 14px 0; overflow-x:auto; max-width:calc(100% - 28px); -webkit-overflow-scrolling:touch;}
    .pst-tab{padding:10px 14px; font-size:12.5px; flex-shrink:0;}
    .pst-body{padding:14px;}
    .pst-panel{padding:14px;}
    .pst-table-scroll{max-height:60vh;}
    .pst-toolbar{flex-direction:column; align-items:stretch;}
    .pst-toolbar input:not([type="checkbox"]):not([type="radio"]), .pst-toolbar select, .pst-toolbar button{width:100%;}
    .pst-toolbar label{width:100%;}
    .pst-count{margin-left:0; text-align:right;}
    .pst-field input, .pst-field select, .pst-field textarea{font-size:16px; padding:10px;}
    .pst-btn{padding:11px 18px; width:100%;}
    .pst-btn-sm{width:auto !important; padding:6px 12px !important; font-size:12px !important;}
    .pst-inline-add-row{flex-direction:column; align-items:stretch;}
    .pst-pagination-bar{flex-direction:row; flex-wrap:wrap;}
    .pst-pagination-bar #ov-prev, .pst-pagination-bar #ov-next{width:auto; flex:1;}
    .pst-pagination-bar #ov-page-label{width:100%; order:3; text-align:center;}
    .pst-pagination-bar #ov-pagesize{width:100%; order:4;}
    .pst-btn-row{flex-direction:column;}
    .pst-card-top{flex-direction:column;}
  }
</style>

<script>
(function(){
  const PARTS_TABLE = "spare_parts_requests";
  const ASSETS_TABLE = "assets";
  const SITES_TABLE = "sites";
  const DEFAULT_CONFIG = {
    url: "https://hktyjebgxtblmyshinmp.supabase.co",
    key: "sb_publishable_TgY-U8AsTvbHFEtkwU9C9Q_zi9ZAieW"
  };
  let config = null;
  let requests = [];
  let assets = [];
  let sites = [];
  let currentTab = "overview";
  let loading = false;
  let session = null; // { role: 'guest'|'technician'|'approver'|'admin'|null, name, id, email }
  let authTokens = null; // { access_token, refresh_token } for the logged-in real user
  let pendingOpenRecordId = null; // set when navigating from Overview -> Store Update for a specific record

  const MACHINE_TYPES = ['Road Sweeper','Pressure Washer','Walk Behind','Rideon','Scrubber Machine','Vaccuum Machine','Wet & Dry Machine','Air Blower'];

  const TAB_ACCESS = {
    guest:       [['overview','Overview']],
    unassigned:  [['overview','Overview']],
    technician:  [['overview','Overview'],['request','New Request'],['store','Store Update']],
    approver:    [['overview','Overview'],['approve','Approvals']],
    admin:       [['overview','Overview'],['request','New Request'],['approve','Approvals'],['store','Store Update'],['procurement','Procurement'],['admin','Manage Users'],['asset_view','Asset Management'],['asset_add','Add Asset']]
  };
  const ALL_TABS = [['overview','Overview'],['request','New Request'],['approve','Approvals'],['store','Store Update'],['procurement','Procurement'],['admin','Manage Users'],['asset_view','Asset Management'],['asset_add','Add Asset']];
  const ROLE_LABEL = {guest:'Guest', unassigned:'Pending', technician:'Technician', approver:'Approver', admin:'Admin'};

  const root = document.getElementById('pst-root');
  const body = document.getElementById('pst-body');
  const ladderEl = document.getElementById('pst-ladder');
  const tabsEl = document.getElementById('pst-tabs');
  const whoamiEl = document.getElementById('pst-whoami');
  const gearBtn = document.getElementById('pst-gear');

  function tabsForSession(){
    if(session && Array.isArray(session.allowedTabs) && session.allowedTabs.length){
      const tabs = ALL_TABS.filter(([key])=> session.allowedTabs.includes(key));
      return tabs.length ? tabs : TAB_ACCESS[session.role] || [];
    }
    return TAB_ACCESS[session.role] || [];
  }
  function renderTabsBar(){
    if(!session){ tabsEl.innerHTML=''; tabsEl.style.display='none'; return; }
    tabsEl.style.display='flex';
    const tabs = tabsForSession();
    if(!tabs.find(t=>t[0]===currentTab)) currentTab = tabs[0][0];
    tabsEl.innerHTML = tabs.map(([key,label])=>
      `<button class="pst-tab ${key===currentTab?'active':''}" data-tab="${key}">${label}</button>`
    ).join('');
    tabsEl.querySelectorAll('.pst-tab').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        currentTab = btn.dataset.tab;
        renderTabsBar();
        render();
      });
    });
  }
  function renderWhoami(){
    if(!session){ whoamiEl.innerHTML=''; ladderEl.style.display='none'; return; }
    whoamiEl.innerHTML = `Logged in as <b>${esc(session.name)}</b> · ${ROLE_LABEL[session.role]} <button id="pst-logout">Switch user</button>`;
    ladderEl.style.display='flex';
    document.getElementById('pst-logout').addEventListener('click', logout);
  }
  function logout(){
    signOutAuth();
    session = null;
    currentTab = 'overview';
    renderWhoami();
    renderTabsBar();
    render();
  }
  gearBtn.addEventListener('click', ()=>{
    if(session && session.role==='admin'){
      currentTab = 'admin';
      renderTabsBar();
      render();
    }else{
      alert('Only admins can manage users. Log in with an admin account first.');
    }
  });

  // ---------- storage / config ----------
  // Uses Claude's window.storage when available (shared across everyone using
  // the app inside Claude.ai). Falls back to the browser's localStorage when
  // the file is opened directly (e.g. double-clicked, or hosted elsewhere) —
  // in that case the saved connection is per-browser, not shared automatically.
  const hasCloudStorage = (typeof window!=='undefined' && !!window.storage);

  async function loadConfig(){
    try{
      if(hasCloudStorage){
        const r = await window.storage.get('supabase-config', true);
        config = r ? JSON.parse(r.value) : null;
      }else{
        const raw = localStorage.getItem('pst-supabase-config');
        config = raw ? JSON.parse(raw) : null;
      }
    }catch(e){ config = null; }
    if(!config && DEFAULT_CONFIG.url && DEFAULT_CONFIG.key){
      config = DEFAULT_CONFIG;
    }
  }
  async function saveConfig(url, key){
    url = url.trim().replace(/\/+$/,'');
    key = key.trim();
    config = {url,key};
    if(hasCloudStorage){
      await window.storage.set('supabase-config', JSON.stringify(config), true);
    }else{
      localStorage.setItem('pst-supabase-config', JSON.stringify(config));
    }
  }
  async function getName(role){
    try{
      if(hasCloudStorage){
        const r = await window.storage.get('pst-name-'+role, false);
        return r ? r.value : '';
      }else{
        return localStorage.getItem('pst-name-'+role) || '';
      }
    }catch(e){ return ''; }
  }
  async function saveName(role, val){
    try{
      if(hasCloudStorage){
        await window.storage.set('pst-name-'+role, val, false);
      }else{
        localStorage.setItem('pst-name-'+role, val);
      }
    }catch(e){}
  }

  // ---------- auth session persistence (per-device, personal — never shared) ----------
  async function saveAuthSession(tokens){
    const raw = JSON.stringify(tokens);
    try{
      if(hasCloudStorage) await window.storage.set('pst-auth', raw, false);
      else localStorage.setItem('pst-auth', raw);
    }catch(e){}
  }
  async function loadAuthSession(){
    try{
      if(hasCloudStorage){
        const r = await window.storage.get('pst-auth', false);
        return r ? JSON.parse(r.value) : null;
      }else{
        const raw = localStorage.getItem('pst-auth');
        return raw ? JSON.parse(raw) : null;
      }
    }catch(e){ return null; }
  }
  async function clearAuthSession(){
    try{
      if(hasCloudStorage) await window.storage.delete('pst-auth', false);
      else localStorage.removeItem('pst-auth');
    }catch(e){}
  }

  // ---------- supabase REST helper ----------
  async function sb(path, options={}){
    if(!config) throw new Error('not_configured');
    const url = config.url + '/rest/v1/' + path;
    const headers = Object.assign({
      'apikey': config.key,
      'Authorization': 'Bearer ' + (authTokens ? authTokens.access_token : config.key),
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=representation'
    }, options.headers||{});
    const res = await fetch(url, {method:options.method||'GET', headers, body: options.body?JSON.stringify(options.body):undefined});
    if(!res.ok){
      const txt = await res.text().catch(()=> '');
      throw new Error('Supabase error ('+res.status+'): '+txt);
    }
    if(res.status===204) return null;
    const txt = await res.text();
    return txt ? JSON.parse(txt) : null;
  }

  // ---------- supabase auth REST helpers ----------
  async function authRequest(path, body){
    const res = await fetch(config.url + '/auth/v1/' + path, {
      method: 'POST',
      headers: {'apikey': config.key, 'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(()=> ({}));
    if(!res.ok){
      throw new Error(data.error_description || data.msg || data.error || 'Authentication failed');
    }
    return data;
  }
  async function signUp(email, password, name){
    const data = await authRequest('signup', {email, password, data:{name}});
    if(data.access_token){
      authTokens = {access_token: data.access_token, refresh_token: data.refresh_token};
      await saveAuthSession(authTokens);
      // upsert so this works whether or not a DB trigger already created the profile row
      await sb('profiles?on_conflict=id', {method:'POST', body:[{id:data.user.id, email, name}], prefer:'resolution=merge-duplicates,return=representation'});
      return {needsConfirmation:false};
    }
    return {needsConfirmation:true};
  }
  async function signIn(email, password){
    const data = await authRequest('token?grant_type=password', {email, password});
    authTokens = {access_token: data.access_token, refresh_token: data.refresh_token};
    await saveAuthSession(authTokens);
  }
  async function signOutAuth(){
    if(authTokens){
      try{
        await fetch(config.url + '/auth/v1/logout', {
          method:'POST',
          headers:{'apikey':config.key, 'Authorization':'Bearer '+authTokens.access_token}
        });
      }catch(e){}
    }
    authTokens = null;
    await clearAuthSession();
  }
  async function tryRestoreSession(){
    const saved = await loadAuthSession();
    if(!saved) return null;
    authTokens = saved;
    try{
      const rows = await sb('profiles?select=*&id=eq.'+parseJwtSub(saved.access_token));
      if(rows && rows[0]) return rows[0];
      return null;
    }catch(e){
      // token likely expired — try refreshing
      try{
        const data = await authRequest('token?grant_type=refresh_token', {refresh_token: saved.refresh_token});
        authTokens = {access_token: data.access_token, refresh_token: data.refresh_token};
        await saveAuthSession(authTokens);
        const rows = await sb('profiles?select=*&id=eq.'+parseJwtSub(authTokens.access_token));
        return rows && rows[0] ? rows[0] : null;
      }catch(e2){
        authTokens = null;
        await clearAuthSession();
        return null;
      }
    }
  }
  function parseJwtSub(token){
    try{
      const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      return payload.sub;
    }catch(e){ return ''; }
  }

  async function loadRequests(){
    loading = true;
    try{
      requests = await sb(PARTS_TABLE+'?select=*&order=created_at.desc.nullslast') || [];
    }catch(e){
      requests = [];
      throw e;
    }finally{
      loading = false;
    }
  }
  async function loadAssets(){
    try{
      assets = await sb(ASSETS_TABLE+'?select=*&order=created_at.desc.nullslast') || [];
    }catch(e){
      assets = [];
      throw e;
    }
  }
  async function loadSites(){
    try{
      sites = await sb(SITES_TABLE+'?select=*&order=site_name.asc') || [];
    }catch(e){
      sites = [];
    }
  }

  // ---------- photo upload (Supabase Storage) ----------
  const PHOTO_BUCKET = "spare-parts-photos";
  const PROCUREMENT_URL = "https://azzurro.u.frappe.cloud/app/material-request/";
  function prNoLink(prNo){
    if(!prNo || !prNo.trim()) return '—';
    const href = PROCUREMENT_URL + encodeURIComponent(prNo.trim());

  async function uploadPhoto(file, prefix){
    if(!file) return null;
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const url = `${config.url}/storage/v1/object/${PHOTO_BUCKET}/${path}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'apikey': config.key,
        'Authorization': 'Bearer ' + (authTokens ? authTokens.access_token : config.key),
        'Content-Type': file.type || 'application/octet-stream'
      },
      body: file
    });
    if(!res.ok){
      const txt = await res.text().catch(()=> '');
      throw new Error('Photo upload failed: '+txt);
    }
    return `${config.url}/storage/v1/object/public/${PHOTO_BUCKET}/${path}`;
  }
  function storagePathFromUrl(url){
    if(!url) return null;
    const marker = `/storage/v1/object/public/${PHOTO_BUCKET}/`;
    const idx = url.indexOf(marker);
    if(idx===-1) return null;
    return url.slice(idx + marker.length).split('?')[0];
  }
  async function deletePhoto(url){
    const path = storagePathFromUrl(url);
    if(!path) return;
    try{
      await fetch(`${config.url}/storage/v1/object/${PHOTO_BUCKET}/${path}`, {
        method: 'DELETE',
        headers: {
          'apikey': config.key,
          'Authorization': 'Bearer ' + (authTokens ? authTokens.access_token : config.key)
        }
      });
    }catch(e){
      // Best-effort: if this fails (e.g. already gone, or storage delete not permitted),
      // we still want the record deletion itself to succeed.
    }
  }
  async function deletePhotos(urls){
    await Promise.all(urls.filter(Boolean).map(deletePhoto));
  }

  function copyToClipboard(text, el){
    const showCopied = ()=>{
      if(!el) return;
      const original = el.textContent;
      const originalColor = el.style.color;
      el.textContent = 'Copied!';
      el.style.color = 'var(--accent)';
      setTimeout(()=>{
        el.textContent = original;
        el.style.color = originalColor;
      }, 900);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(showCopied).catch(()=>{
        fallbackCopy(text);
        showCopied();
      });
    }else{
      fallbackCopy(text);
      showCopied();
    }
  }
  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }

  const PARTS_COLUMNS = ['request_date','site_project','machine','make','model','machine_serial','parts','quantity','priority','reason','requested_by','approval_status','approved_by','delivery_status','do_no','delivery_date','received_person','installation_status','remarks','nameplate_photo_url','history_card_photo_url'];

  let xlsxLoadPromise = null;
  function loadXLSX(){
    if(window.XLSX) return Promise.resolve(window.XLSX);
    if(xlsxLoadPromise) return xlsxLoadPromise;
    xlsxLoadPromise = new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = ()=> resolve(window.XLSX);
      s.onerror = ()=> reject(new Error('Could not load the Excel library. Check your internet connection and try again.'));
      document.head.appendChild(s);
    });
    return xlsxLoadPromise;
  }

      const ws = XLSX.utils.aoa_to_sheet([PARTS_COLUMNS, example]);

  function normalizeHeader(h){
    return String(h||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  }
  function canonicalStatus(val, options, fallback){
    const v = String(val||'').trim();
    if(!v) return fallback;
    const match = options.find(o=>o.toLowerCase()===v.toLowerCase());
    return match || v; // unrecognized text is kept as-is rather than silently dropped
  }
  function normalizeImportValue(col, val){
    if(val==null) return '';
    if(val instanceof Date){
      const y=val.getFullYear(), m=String(val.getMonth()+1).padStart(2,'0'), d=String(val.getDate()).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
    return String(val).trim();
  }
  function dupKey(r){
    return [r.site_project, r.parts, r.request_date].map(v=>String(v||'').trim().toLowerCase()).join('|');
  }
  async function parseImportFile(file){
    const XLSX = await loadXLSX();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rawRows = XLSX.utils.sheet_to_json(ws, {defval:''});
    const rows = [];
    const skipped = [];
    rawRows.forEach((raw, idx)=>{
      const norm = {};
      Object.keys(raw).forEach(k=>{ norm[normalizeHeader(k)] = raw[k]; });
      const payload = {};
      PARTS_COLUMNS.forEach(col=>{
        const v = norm[col];
        payload[col] = (v!==undefined && v!=='') ? normalizeImportValue(col, v) : null;
      });
      const missingRequired = REQUIRED_IMPORT_COLUMNS.filter(c=>!payload[c]);
      if(missingRequired.length){
        if(Object.keys(payload).length) skipped.push({row: idx+2, reason: 'Missing '+missingRequired.join(', ')});
        return; // blank / incomplete row, skip silently-ish
      }
      payload.quantity = parseInt(payload.quantity)||1;
      payload.approval_status = canonicalStatus(payload.approval_status, ['Pending','Approved','Rejected'], 'Pending');
      payload.delivery_status = canonicalStatus(payload.delivery_status, ['Pending','Dispatched','Delivered','Returned','Cancelled'], 'Pending');
      payload.installation_status = canonicalStatus(payload.installation_status, ['Pending','Installed','Not Required'], 'Pending');
      rows.push(payload);
    });
    return {rows, skipped};
  }
  async function importRows(rows, onProgress, table){
    const CHUNK = 200;
    let imported = 0;
    const errors = [];
    for(let i=0; i<rows.length; i+=CHUNK){
      const chunk = rows.slice(i, i+CHUNK);
      try{
        await sb(table || PARTS_TABLE, {method:'POST', body:chunk});
        imported += chunk.length;
      }catch(e){
        errors.push(`Rows ${i+1}–${i+chunk.length}: ${e.message}`);
      }
      onProgress && onProgress(Math.min(i+CHUNK, rows.length), rows.length);
    }
    return {imported, errors};
  }

      if(!file){ msg.innerHTML = '<div class="pst-msg pst-msg-err">Choose a file first.</div>'; return; }
      btn.disabled = true;
      msg.innerHTML = '<div class="pst-msg pst-msg-ok">Reading file…</div>';

        const {rows, skipped} = await parseImportFile(file);
        if(!rows.length){
          msg.innerHTML = '<div class="pst-msg pst-msg-err">No valid rows found. Make sure column headers match the template and each row has at least Site/Project and Parts filled in.</div>';
          btn.disabled = false;
          return;

        msg.innerHTML = '<div class="pst-msg pst-msg-ok">Checking for duplicates…</div>';
        await loadRequests(); // refresh so dedup checks against the latest data
        const existingKeys = new Set(requests.map(dupKey));
        const seenInFile = new Set();
        const toImport = [];
        let duplicateCount = 0;
        rows.forEach(row=>{
          const key = dupKey(row);
          if(existingKeys.has(key) || seenInFile.has(key)){
            duplicateCount++;
            return;
          }
          seenInFile.add(key);
          toImport.push(row);
        });
        if(!toImport.length){
          msg.innerHTML = `<div class="pst-msg pst-msg-err">Nothing to import — all ${rows.length} row(s) already exist (matched on Site/Project + Parts + Date).</div>`;
          btn.disabled = false;
          return;

        msg.innerHTML = `<div class="pst-msg pst-msg-ok">Importing 0 of ${toImport.length}…</div>`;
        const {imported, errors} = await importRows(toImport, (done, total)=>{
          msg.innerHTML = `<div class="pst-msg pst-msg-ok">Importing ${done} of ${total}…</div>`;
        });
        let summary = `<div class="pst-msg ${errors.length?'pst-msg-err':'pst-msg-ok'}">Imported ${imported} of ${toImport.length} new row(s).`;
        if(duplicateCount) summary += ` ${duplicateCount} row(s) skipped as duplicates (matched Site/Project + Parts + Date).`;
        if(skipped.length) summary += ` ${skipped.length} row(s) skipped (missing required fields).`;
        if(errors.length) summary += `<br>${errors.map(esc).join('<br>')}`;
        summary += '</div>';
        msg.innerHTML = summary;
        fileInput.value = '';

  function isHeicUrl(url){
    return /\.(heic|heif)(\?|#|$)/i.test(url||'');
  }
  function photoThumb(url){
    if(!url) return '<span style="color:var(--ink-soft);">—</span>';
    if(isHeicUrl(url)){
      return `<span class="pst-photo-thumb pst-heic-thumb" data-full="${esc(url)}" data-heic="1" data-src="${esc(url)}" style="cursor:pointer; display:inline-block;">
        <span class="pst-heic-placeholder" style="display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:4px; border:1px solid var(--line); background:var(--gray-soft); font-size:8.5px; font-weight:700; color:var(--ink-soft);">HEIC</span>
      </span>`;
    }
    return `<span class="pst-photo-thumb" data-full="${esc(url)}" style="cursor:pointer; display:inline-block;"><img src="${esc(url)}" alt="photo" style="width:36px; height:36px; object-fit:cover; border-radius:4px; border:1px solid var(--line);"></span>`;
  }
  let heic2anyLoadPromise = null;
  function loadHeic2Any(){
    if(window.heic2any) return Promise.resolve(window.heic2any);
    if(heic2anyLoadPromise) return heic2anyLoadPromise;
    heic2anyLoadPromise = new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/heic2any/dist/heic2any.min.js';
      s.onload = ()=> resolve(window.heic2any);
      s.onerror = ()=> reject(new Error('Could not load HEIC preview support.'));
      document.head.appendChild(s);
    });
    return heic2anyLoadPromise;
  }
  const heicPreviewCache = {}; // original url -> converted JPEG object URL, reused by thumbnails and the lightbox
  async function getHeicPreview(url){
    if(heicPreviewCache[url]) return heicPreviewCache[url];
    const heic2any = await loadHeic2Any();
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('Could not fetch photo');
    const blob = await resp.blob();
    const converted = await heic2any({blob, toType:'image/jpeg', quality:0.85});
    const outBlob = Array.isArray(converted) ? converted[0] : converted;
    const objUrl = URL.createObjectURL(outBlob);
    heicPreviewCache[url] = objUrl;
    return objUrl;
  }
  async function convertHeicThumb(el){
    const url = el.dataset.src;
    const placeholder = el.querySelector('.pst-heic-placeholder');
    try{

    }catch(e){
      if(placeholder) placeholder.title = 'Could not preview this HEIC photo — click to view options.';
    }
  }

  function photoFilename(url){
    try{ return decodeURIComponent(url.split('/').pop().split('?')[0]) || 'photo'; }

  }
  async function downloadPhoto(url, filename){
    try{
      const resp = await fetch(url);
      if(!resp.ok) throw new Error('Download failed');
      const blob = await resp.blob();
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl;
      a.download = filename || 'photo';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(objUrl), 4000);
    }catch(e){
      window.open(url, '_blank'); // fallback if fetch is blocked for any reason
    }
  }
  function openLightbox(url, isHeic){
    lightboxUrl = url;

      lbImg.src = src;
      lbImg.style.display = 'block';
      lbLoading.style.display = 'none';
    };
    if(isHeic){

        if(lightboxUrl!==url) return;
        lbLoading.textContent = "Could not preview this HEIC photo, but you can still download the original below.";
      });
    }else{

    parts: r=> (r.parts||'').toLowerCase(),
    qty: r=> Number(r.quantity)||0,
    priority: r=> priorityRank(r.priority),
    requested_by: r=> (r.requested_by||'').toLowerCase(),
    approval: r=> (r.approval_status||'').toLowerCase(),
    pr_no: r=> (r.pr_no||'').toLowerCase(),
    lpo_no: r=> (r.lpo_no||'').toLowerCase(),
    delivery: r=> (r.delivery_status||'').toLowerCase(),
    do_no: r=> (r.do_no||'').toLowerCase(),
    delivery_date: r=> r.delivery_date || '',
    received_by: r=> (r.received_person||'').toLowerCase(),
    installation: r=> (r.installation_status||'').toLowerCase(),
    remarks: r=> (r.remarks||'').toLowerCase()
  };
  function sortRequests(list){
    if(!ovSort.key) return list;
    const getVal = OV_SORT_VALUE[ovSort.key];
    if(!getVal) return list;
    const sorted = list.slice().sort((a,b)=>{
      const av = getVal(a), bv = getVal(b);
      if(av < bv) return -1 * ovSort.dir;
      if(av > bv) return 1 * ovSort.dir;
      return 0;
    });
    return sorted;
  }
  function wireOverview(){
    const tbody = document.getElementById('ov-tbody');
    const countEl = document.getElementById('ov-count');
    const pageLabelEl = document.getElementById('ov-page-label');
    const prevBtn = document.getElementById('ov-prev');
    const nextBtn = document.getElementById('ov-next');
    const pageSizeEl = document.getElementById('ov-pagesize');
    pageSizeEl.value = String(ovPageSize);
    function apply(){
      const q = document.getElementById('ov-search').value.toLowerCase();
      const ap = document.getElementById('ov-approval').value;
      const de = document.getElementById('ov-delivery').value;
      let list = requests.filter(r=>{
        if(ap && !statusEq(r.approval_status,ap)) return false;
        if(de && !statusEq(r.delivery_status,de)) return false;
        if(q){
          const hay = [r.site_project,r.parts,r.machine,r.requested_by,r.make,r.model].join(' ').toLowerCase();
          if(!hay.includes(q)) return false;
        }
        return true;
      });
      list = sortRequests(list);
      const total = list.length;
      const pageSize = ovPageSize==='all' ? total : ovPageSize;
      const totalPages = pageSize>0 ? Math.max(1, Math.ceil(total/pageSize)) : 1;
      if(ovPage > totalPages) ovPage = totalPages;
      if(ovPage < 1) ovPage = 1;
      const start = pageSize>0 ? (ovPage-1)*pageSize : 0;
      const pageList = ovPageSize==='all' ? list : list.slice(start, start+pageSize);
      tbody.innerHTML = ovRows(pageList);
      renderHeicThumbs(tbody);
      wirePhotoThumbs(tbody);
      countEl.textContent = total + ' of ' + requests.length + ' requests';
      if(ovPageSize==='all' || total===0){
        pageLabelEl.textContent = total===0 ? 'No results' : `Showing all ${total}`;
      }else{
        pageLabelEl.textContent = `Page ${ovPage} of ${totalPages} (${start+1}–${Math.min(start+pageSize,total)} of ${total})`;
      }
      prevBtn.disabled = ovPage<=1 || ovPageSize==='all';
      nextBtn.disabled = ovPage>=totalPages || ovPageSize==='all';
      tbody.querySelectorAll('.ov-store-jump').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          const id = btn.dataset.id;
          const r = requests.find(x=>x.id===id);
          if(r) openInStoreUpdate(r);
        });
      });
      tbody.querySelectorAll('.ov-copy-serial').forEach(el=>{
        el.addEventListener('click', ()=>{
          copyToClipboard(el.dataset.copy, el);
        });
      });
      if(session.role==='admin'){
        tbody.querySelectorAll('.ov-delete').forEach(btn=>{
          btn.addEventListener('click', async (e)=>{
            e.stopPropagation();
            const id = btn.dataset.id;
            const r = requests.find(x=>x.id===id);
            const label = r ? `${r.parts} (${reqSerial(r)})` : 'this record';
            if(!confirm(`Delete request for "${label}"? This cannot be undone.`)) return;
            btn.disabled = true;
            try{
              const result = await sb(PARTS_TABLE+'?id=eq.'+id, {method:'DELETE'});
              if(!result || result.length===0){
                throw new Error('Nothing was deleted. Your database permissions (Row Level Security) likely don\'t allow admins to delete records yet — see the delete policy note in Manage Users / ask whoever set up Supabase to run the DELETE policy SQL.');
              }
              if(r) deletePhotos([r.nameplate_photo_url, r.history_card_photo_url]); // best-effort, don't block on this
              requests = requests.filter(x=>x.id!==id);
              renderLadder();
              apply();
            }catch(err){
              alert('Could not delete: '+err.message);
              btn.disabled = false;
            }
          });
        });
      }
    }
    ['ov-search','ov-approval','ov-delivery'].forEach(id=>{
      document.getElementById(id).addEventListener('input', ()=>{ ovPage=1; apply(); });
      document.getElementById(id).addEventListener('change', ()=>{ ovPage=1; apply(); });
    });
    document.getElementById('ov-export').addEventListener('click', exportCSV);
    prevBtn.addEventListener('click', ()=>{ if(ovPage>1){ ovPage--; apply(); } });
    nextBtn.addEventListener('click', ()=>{ ovPage++; apply(); });
    pageSizeEl.addEventListener('change', ()=>{
      ovPageSize = pageSizeEl.value==='all' ? 'all' : parseInt(pageSizeEl.value);
      ovPage = 1;
      apply();
    });
    function updateSortArrows(){
      document.querySelectorAll('#ov-thead th.ov-sortable').forEach(th=>{
        const arrow = th.querySelector('.ov-sort-arrow');
        if(th.dataset.sort === ovSort.key){
          arrow.textContent = ovSort.dir===1 ? ' ▲' : ' ▼';
          th.classList.add('ov-sorted');
        }else{
          arrow.textContent = '';
          th.classList.remove('ov-sorted');
        }
      });
    }
    document.querySelectorAll('#ov-thead th.ov-sortable').forEach(th=>{
      th.addEventListener('click', ()=>{
        const key = th.dataset.sort;
        if(ovSort.key===key){
          ovSort.dir = -ovSort.dir;
        }else{
          ovSort = {key, dir:1};
        }
        ovPage = 1;
        updateSortArrows();
        apply();
      });
    });
    updateSortArrows();
    apply();
  }
  function openInStoreUpdate(r){
    const tabs = tabsForSession();
    if(!tabs.find(t=>t[0]==='store')){
      alert('Store Update isn\'t available for your account.');
      return;
    }
    if(!statusEq(r.approval_status,'Approved')){
      alert('This request hasn\'t been approved yet, so it doesn\'t appear in Store Update.');
      return;
    }
    pendingOpenRecordId = r.id;
    currentTab = 'store';
    renderTabsBar();
    render();

  function exportCSV(){
    const cols = ['id','request_date','site_project','machine','make','model','machine_serial','parts','quantity','priority','reason','requested_by','approval_status','approved_by','pr_no','lpo_no','delivery_status','do_no','delivery_date','received_person','installation_status','remarks','nameplate_photo_url','history_card_photo_url'];
    const lines = [cols.join(',')];
    requests.forEach(r=>{
      lines.push(cols.map(c=>{
        let v = r[c]==null? '' : String(r[c]).replace(/"/g,'""');
        return /[,"\n]/.test(v) ? `"${v}"` : v;
      }).join(','));
    });
    const blob = new Blob([lines.join('\n')], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'spare_parts_requests.csv';
    a.click();
  }

  function wireApprove(){
    const pending = requests.filter(r=>statusEq(r.approval_status,'Pending'));
    const list = document.getElementById('ap-list');
    if(!pending.length){
      list.innerHTML = `<div class="pst-empty"><div class="pst-empty-title">Queue is clear</div>No requests waiting on approval.</div>`;
      return;
    }
    list.innerHTML = pending.map(approveCard).join('');
    list.querySelectorAll('.pst-card').forEach(card=>{
      const id = card.dataset.id;
      const msgEl = card.querySelector('.ap-msg');
      const actionsEl = card.querySelector('.ap-actions');
      const rejectBox = card.querySelector('.ap-reject-box');
      const reasonEl = card.querySelector('.ap-reject-reason');
      async function act(status, extraRemarks){
        const approver = document.getElementById('ap-name').value.trim();
        if(!approver){ msgEl.innerHTML = '<div class="pst-msg pst-msg-err">Enter your name first.</div>'; return; }
        const payload = {
          approval_status: status, approved_by: approver, approval_date: new Date().toISOString().slice(0,10)
        };
        if(extraRemarks){
          const existingReq = requests.find(x=>x.id===id);
          const existing = (existingReq && existingReq.remarks) ? existingReq.remarks.trim() : '';
          payload.remarks = existing ? existing + '\n' + extraRemarks : extraRemarks;
        }
        try{
          await sb(PARTS_TABLE+'?id=eq.'+id, {method:'PATCH', body:payload});
          await saveName('mgr', approver);
          card.style.opacity='0.4';
          msgEl.innerHTML = `<div class="pst-msg pst-msg-ok">Marked ${status}.</div>`;
          setTimeout(render, 500);
        }catch(e){
          msgEl.innerHTML = `<div class="pst-msg pst-msg-err">${esc(e.message)}</div>`;
        }
      }
      card.querySelector('.ap-approve').addEventListener('click', ()=>act('Approved'));
      card.querySelector('.ap-reject').addEventListener('click', ()=>{
        actionsEl.style.display = 'none';
        rejectBox.style.display = 'block';
        reasonEl.focus();
      });
      card.querySelector('.ap-reject-cancel').addEventListener('click', ()=>{
        rejectBox.style.display = 'none';
        actionsEl.style.display = 'flex';
        reasonEl.value = '';
        msgEl.innerHTML = '';
      });
      card.querySelector('.ap-reject-confirm').addEventListener('click', ()=>{
        const reason = reasonEl.value.trim();
        if(!reason){
          msgEl.innerHTML = '<div class="pst-msg pst-msg-err">Please enter a reason for rejecting this request.</div>';
          return;
        }
        act('Rejected', `Rejected: ${reason}`);
      });
    });
  }

  function wireStore(){
    const listEl = document.getElementById('st-list');
    const countEl = document.getElementById('st-count');
    const searchEl = document.getElementById('st-search');
    const filterEl = document.getElementById('st-filter');
    const statsEl = document.getElementById('st-stats');
    function isPendingDelivery(r){
      return !statusEq(r.delivery_status,'Delivered') && !statusEq(r.delivery_status,'Returned') && !statusEq(r.delivery_status,'Cancelled');
    }
    function isPendingInstallation(r){
      return statusEq(r.delivery_status,'Delivered') && statusEq(r.installation_status,'Pending');
    }
    function apply(){
      const q = (searchEl.value||'').toLowerCase();
      const allApproved = requests.filter(r=>statusEq(r.approval_status,'Approved'));
      const pendingDeliveryCount = allApproved.filter(isPendingDelivery).length;
      const pendingInstallCount = allApproved.filter(isPendingInstallation).length;
      statsEl.textContent = `${pendingDeliveryCount} pending delivery · ${pendingInstallCount} pending installation`;
      let approved = allApproved;
      if(filterEl.value==='pending_delivery') approved = approved.filter(isPendingDelivery);
      else if(filterEl.value==='pending_installation') approved = approved.filter(isPendingInstallation);
      if(q){
        approved = approved.filter(r=>{
          const hay = [r.site_project,r.parts,r.machine,r.requested_by,r.make,r.model].join(' ').toLowerCase();
          return hay.includes(q);
        });
      }
      if(!approved.length){
        listEl.innerHTML = `<div class="pst-empty"><div class="pst-empty-title">Nothing here</div>${q ? 'No approved requests match your search.' : 'Nothing matches this filter right now.'}</div>`;
        countEl.textContent = '';
        return;
      }
      listEl.innerHTML = approved.map(storeCard).join('');
      countEl.textContent = approved.length + ' of ' + allApproved.length + ' requests';
      wireStoreCards();
    }
    searchEl.addEventListener('input', apply);
    filterEl.addEventListener('change', apply);
    apply();
  }
  function wireStoreCards(){
    const list = document.getElementById('st-list');
    list.querySelectorAll('.pst-card').forEach(card=>{
      const id = card.dataset.id;
      const msgEl = card.querySelector('.st-msg');
      const details = card.querySelector('.st-details');
      const caret = card.querySelector('.st-caret');
      card.querySelector('.st-toggle').addEventListener('click', ()=>{
        const isOpen = details.style.display !== 'none';
        details.style.display = isOpen ? 'none' : 'block';
        caret.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(90deg)';
      });
      card.querySelector('.st-save').addEventListener('click', async ()=>{
        const payload = {
          delivery_status: card.querySelector('.st-delivery').value,
          do_no: card.querySelector('.st-do').value.trim(),
          delivery_date: card.querySelector('.st-date').value || null,
          received_person: card.querySelector('.st-received').value.trim(),
          installation_status: card.querySelector('.st-install').value,
          remarks: card.querySelector('.st-remarks').value.trim()
        };
        try{
          await sb(PARTS_TABLE+'?id=eq.'+id, {method:'PATCH', body:payload});
          msgEl.innerHTML = '<div class="pst-msg pst-msg-ok">Saved.</div>';
          Object.assign(requests.find(r=>r.id===id), payload);
          renderLadder();
        }catch(e){
          msgEl.innerHTML = `<div class="pst-msg pst-msg-err">${esc(e.message)}</div>`;
        }
      });
    });
    if(pendingOpenRecordId){
      const card = list.querySelector(`.pst-card[data-id="${pendingOpenRecordId}"]`);
      if(card){
        card.querySelector('.st-details').style.display = 'block';
        card.querySelector('.st-caret').style.transform = 'rotate(90deg)';
        card.scrollIntoView({behavior:'smooth', block:'start'});
      }
      pendingOpenRecordId = null;
    }
  }

  function wireProcurement(){

    const countEl = document.getElementById('pr-count');

    function apply(){

        approved = approved.filter(r=> !(r.pr_no && r.pr_no.trim()));

  function wireProcurementCards(){

  const AS_SORT_COLUMNS = [
    {key:'site', label:'Site Name'},
    {key:'location', label:'Location'},
    {key:'barcode', label:'Barcode'},
    {key:'machine', label:'Machine Name'},
    {key:'model', label:'Model No'},
    {key:'serial', label:'Serial No'},
    {key:'year', label:'Year Installed'},
    {key:'last_service', label:'Last Service'},
    {key:'technician', label:'Technician'}
  ];
  const AS_SORT_VALUE = {
    site: a=> (a.site_name||'').toLowerCase(),
    location: a=> (a.location||'').toLowerCase(),
    barcode: a=> (a.barcode||'').toLowerCase(),
    machine: a=> (a.machine_name||'').toLowerCase(),
    model: a=> (a.model_no||'').toLowerCase(),
    serial: a=> (a.serial_no||'').toLowerCase(),
    year: a=> Number(a.year_of_installation)||0,
    last_service: a=> a.date_of_last_service || '',
    technician: a=> (a.technician_name||'').toLowerCase()
  };
  let asSort = {key:null, dir:1};
  let asPage = 1;
  let asPageSize = 50;
  function sortAssets(list){
    if(!asSort.key) return list;
    const getVal = AS_SORT_VALUE[asSort.key];
    if(!getVal) return list;
    return list.slice().sort((a,b)=>{
      const av = getVal(a), bv = getVal(b);
      if(av < bv) return -1 * asSort.dir;
      if(av > bv) return 1 * asSort.dir;
      return 0;
    });
  }
  function assetViewView(){
    const headCells = AS_SORT_COLUMNS.map(c=>
      `<th class="ov-sortable" data-sort="${c.key}">${c.label}<span class="ov-sort-arrow"></span></th>`
    ).join('');
    return `
      <div class="pst-panel">
        <p class="pst-panel-title">Asset Management</p>
        <p class="pst-panel-desc">Machine assets logged across all sites. Click a column heading to sort, click a photo to view it full-size.</p>
        <div class="pst-toolbar">
          <input type="text" id="as-search" placeholder="Search site, machine, serial, technician…">
          <span class="pst-count" id="as-count"></span>
        </div>
        <div class="pst-table-scroll">
        <table class="pst-table">
          <thead><tr id="as-thead">
            ${headCells}<th>Machine Photo</th><th>Name Plate</th>${session.role==='admin' ? '<th></th>' : ''}
          </tr></thead>
          <tbody id="as-tbody"></tbody>
        </table>
        </div>
        <div class="pst-toolbar" style="margin-top:12px; border-top:1px solid var(--line); padding-top:12px;">
          <button class="pst-btn pst-btn-ghost" id="as-prev">‹ Prev</button>
          <span class="pst-count" id="as-page-label"></span>
          <button class="pst-btn pst-btn-ghost" id="as-next">Next ›</button>
          <select id="as-pagesize" style="margin-left:auto;">
            <option value="50">50 per page</option>
            <option value="100">100 per page</option>
            <option value="200">200 per page</option>
            <option value="all">Show all</option>
          </select>
        </div>
      </div>`;
  }
  function asRows(list){
    if(!list.length) return `<tr><td colspan="12" class="pst-empty">No matching assets.</td></tr>`;
    return list.map(a=>`
      <tr data-id="${a.id}">
        <td>${esc(a.site_name||'—')}</td>
        <td>${esc(a.location||'—')}</td>
        <td class="pst-mono">${esc(a.barcode||'—')}</td>
        <td>${esc(a.machine_name||'—')}</td>
        <td>${esc(a.model_no||'—')}</td>
        <td class="pst-mono">${esc(a.serial_no||'—')}</td>
        <td>${esc(a.year_of_installation||'—')}</td>
        <td>${fmtDate(a.date_of_last_service)}</td>
        <td>${esc(a.technician_name||'—')}</td>
        <td>${photoThumb(a.machine_photo_url)}</td>
        <td>${photoThumb(a.nameplate_photo_url)}</td>
        ${session.role==='admin' ? `<td><button class="pst-icon-btn as-delete" title="Delete asset" data-id="${a.id}">🗑</button></td>` : ''}
      </tr>`).join('');
  }
  function wireAssetView(){
    const tbody = document.getElementById('as-tbody');
    const countEl = document.getElementById('as-count');
    const pageLabelEl = document.getElementById('as-page-label');
    const prevBtn = document.getElementById('as-prev');
    const nextBtn = document.getElementById('as-next');
    const pageSizeEl = document.getElementById('as-pagesize');
    const searchEl = document.getElementById('as-search');
    pageSizeEl.value = String(asPageSize);
    function apply(){
      const q = searchEl.value.toLowerCase();
      let list = assets.filter(a=>{
        if(!q) return true;
        const hay = [a.site_name,a.location,a.machine_name,a.model_no,a.serial_no,a.technician_name,a.barcode].join(' ').toLowerCase();
        return hay.includes(q);
      });
      list = sortAssets(list);
      const total = list.length;
      const pageSize = asPageSize==='all' ? total : asPageSize;
      const totalPages = pageSize>0 ? Math.max(1, Math.ceil(total/pageSize)) : 1;
      if(asPage > totalPages) asPage = totalPages;
      if(asPage < 1) asPage = 1;
      const start = pageSize>0 ? (asPage-1)*pageSize : 0;
      const pageList = asPageSize==='all' ? list : list.slice(start, start+pageSize);
      tbody.innerHTML = asRows(pageList);
      renderHeicThumbs(tbody);
      wirePhotoThumbs(tbody);
      countEl.textContent = total + ' of ' + assets.length + ' assets';
      if(asPageSize==='all' || total===0){
        pageLabelEl.textContent = total===0 ? 'No results' : `Showing all ${total}`;
      }else{
        pageLabelEl.textContent = `Page ${asPage} of ${totalPages} (${start+1}–${Math.min(start+pageSize,total)} of ${total})`;
      }
      prevBtn.disabled = asPage<=1 || asPageSize==='all';
      nextBtn.disabled = asPage>=totalPages || asPageSize==='all';
      if(session.role==='admin'){
        tbody.querySelectorAll('.as-delete').forEach(btn=>{
          btn.addEventListener('click', async (e)=>{
            e.stopPropagation();
            const id = btn.dataset.id;
            const a = assets.find(x=>x.id===id);
            const label = a ? `${a.machine_name||'asset'} (${a.serial_no||a.site_name||''})` : 'this asset';
            if(!confirm(`Delete asset "${label}"? This cannot be undone.`)) return;
            btn.disabled = true;
            try{
              const result = await sb(ASSETS_TABLE+'?id=eq.'+id, {method:'DELETE'});
              if(!result || result.length===0){
                throw new Error('Nothing was deleted. Your database permissions (Row Level Security) may not allow admins to delete assets yet.');
              }
              if(a) deletePhotos([a.machine_photo_url, a.nameplate_photo_url]); // best-effort, don't block on this
              assets = assets.filter(x=>x.id!==id);
              apply();
            }catch(err){
              alert('Could not delete: '+err.message);
              btn.disabled = false;
            }
          });
        });
      }
    }
    searchEl.addEventListener('input', ()=>{ asPage=1; apply(); });
    prevBtn.addEventListener('click', ()=>{ if(asPage>1){ asPage--; apply(); } });
    nextBtn.addEventListener('click', ()=>{ asPage++; apply(); });
    pageSizeEl.addEventListener('change', ()=>{
      asPageSize = pageSizeEl.value==='all' ? 'all' : parseInt(pageSizeEl.value);
      asPage = 1;
      apply();
    });
    function updateSortArrows(){
      document.querySelectorAll('#as-thead th.ov-sortable').forEach(th=>{
        const arrow = th.querySelector('.ov-sort-arrow');
        if(th.dataset.sort === asSort.key){
          arrow.textContent = asSort.dir===1 ? ' ▲' : ' ▼';
          th.classList.add('ov-sorted');
        }else{
          arrow.textContent = '';
          th.classList.remove('ov-sorted');
        }
      });
    }
    document.querySelectorAll('#as-thead th.ov-sortable').forEach(th=>{
      th.addEventListener('click', ()=>{
        const key = th.dataset.sort;
        if(asSort.key===key){ asSort.dir = -asSort.dir; }
        else{ asSort = {key, dir:1}; }
        asPage = 1;
        updateSortArrows();
        apply();
      });
    });
    updateSortArrows();
    apply();
  }

  function wireAssetAdd(){
    wirePhotoField('as-add-photo-machine');
    wirePhotoField('as-add-photo-nameplate');
    document.getElementById('as-add-clear').addEventListener('click', ()=>{
      const msg = document.getElementById('as-add-msg');
      if(!confirm('Clear all fields in this form?')) return;
      document.getElementById('as-add-site').value = '';
      document.getElementById('as-add-location').value = '';
      document.getElementById('as-add-barcode').value = '';
      document.getElementById('as-add-machine').value = '';
      document.getElementById('as-add-model').value = '';
      document.getElementById('as-add-serial').value = '';
      document.getElementById('as-add-year').value = '';
      document.getElementById('as-add-lastservice').value = '';
      clearPhotoField('as-add-photo-machine');
      clearPhotoField('as-add-photo-nameplate');
      msg.innerHTML = '';
    });
    document.getElementById('as-add-submit').addEventListener('click', async ()=>{
      const msg = document.getElementById('as-add-msg');
      const submitBtn = document.getElementById('as-add-submit');
      const site = document.getElementById('as-add-site').value.trim();
      const machine = document.getElementById('as-add-machine').value.trim();
      const serial = document.getElementById('as-add-serial').value.trim();
      const name = requesterIdentity();
      if(!site || !machine || !serial || !name){
        msg.innerHTML = '<div class="pst-msg pst-msg-err">Please fill in at least Site Name, Machine Name and Serial No.</div>';
        return;
      }
      const machineFile = getPhotoFieldFile('as-add-photo-machine');
      const nameplateFile = getPhotoFieldFile('as-add-photo-nameplate');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting…';
      msg.innerHTML = '';
      try{
        let machineUrl = null, nameplateUrl = null;
        if(machineFile || nameplateFile){
          msg.innerHTML = '<div class="pst-msg pst-msg-ok">Uploading photos…</div>';
          [machineUrl, nameplateUrl] = await Promise.all([
            uploadPhoto(machineFile, 'asset-machine'),
            uploadPhoto(nameplateFile, 'asset-nameplate')
          ]);
        }
        const yearVal = document.getElementById('as-add-year').value;
        const payload = {
          site_name: site,
          location: document.getElementById('as-add-location').value.trim(),
          barcode: document.getElementById('as-add-barcode').value.trim() || null,
          machine_name: machine,
          model_no: document.getElementById('as-add-model').value.trim(),
          serial_no: serial,
          year_of_installation: yearVal ? parseInt(yearVal) : null,
          date_of_last_service: document.getElementById('as-add-lastservice').value || null,
          technician_name: name,
          machine_photo_url: machineUrl,
          nameplate_photo_url: nameplateUrl
        };
        await sb(ASSETS_TABLE, {method:'POST', body:[payload]});
        msg.innerHTML = '<div class="pst-msg pst-msg-ok">Asset saved.</div>';
        document.getElementById('as-add-location').value = '';
        document.getElementById('as-add-barcode').value = '';
        document.getElementById('as-add-machine').value = '';
        document.getElementById('as-add-model').value = '';
        document.getElementById('as-add-serial').value = '';
        document.getElementById('as-add-year').value = '';
        document.getElementById('as-add-lastservice').value = '';
        clearPhotoField('as-add-photo-machine');
        clearPhotoField('as-add-photo-nameplate');
      }catch(e){
        msg.innerHTML = `<div class="pst-msg pst-msg-err">Could not submit: ${esc(e.message)}</div>`;
      }finally{
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Asset';
      }
    });
  }

  // ---------- init ----------
  (async function init(){
    await loadConfig();
    try{
      const restored = await tryRestoreSession();
      if(restored){
        session = {
          role: resolveRole(restored),
          name: restored.name,
          id: restored.id,
          email: restored.email,
          allowedTabs: Array.isArray(restored.allowed_tabs) ? restored.allowed_tabs : null
        };
      }
    }catch(e){}
    render();
  })();
})();
